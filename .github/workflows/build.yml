name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Self-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          javac -d out $(ls src/main/java/com/rzauto/logic/*.java | grep -v VehicleCatalog) \
                src/main/java/com/rzauto/perf/*.java tools/SelfTest*.java 2>&1 | tee selftest.log
          for t in SelfTest SelfTestMore SelfTestState SelfTestWheel SelfTestPerf; do
            echo "== $t" | tee -a selftest.log
            java -cp out $t 2>&1 | tee -a selftest.log
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Gradle build
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee build.log

      - name: API signatures
        if: always()
        shell: bash
        run: |
          : > api_dump.txt
          JARS=$(find ~/.gradle -type f \( -name 'minecraft-*.jar' -o -name 'minecraft-merged*.jar' -o -name 'client*.jar' \) ! -name '*sources*' 2>/dev/null | head -20)
          echo "JARS: $JARS" >> api_dump.txt
          [ -f api_query.txt ] && while read -r c; do
            [ -z "$c" ] && continue
            echo "=== $c" >> api_dump.txt
            javap -public -cp "$(echo $JARS | tr ' ' ':')" "$c" >> api_dump.txt 2>&1 || true
          done < api_query.txt
          FAPI=$(find ~/.gradle -type f -name 'fabric-api-*.jar' ! -name '*sources*' | head -1)
          echo "FABRIC_API_JAR: $FAPI" >> api_dump.txt

      - name: Publish logs and jar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          FILES="selftest.log build.log api_dump.txt"
          for f in build/libs/*.jar; do case "$f" in *sources*) ;; *) FILES="$FILES $f";; esac; done
          gh release create latest $FILES --title "latest build" \
            --notes "Автосборка $GITHUB_SHA" --prerelease
