plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}
loom {
	splitEnvironmentSourceSets()
	mods {
		"rz_auto" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ---- Справка по API (только для разработки): печатает в лог сигнатуры классов из api_query.txt
// и ищет классы по шаблонам из api_find.txt. Запускается после compileJava, даже если он упал.
tasks.register('apiDump') {
	doLast {
		def files = [] as LinkedHashSet
		files.addAll(sourceSets.main.compileClasspath.files)
		try { files.addAll(sourceSets.client.compileClasspath.files) } catch (Throwable t) {}
		def jars = files.findAll { it.name.endsWith('.jar') }
		def cp = jars.collect { it.absolutePath }.join(File.pathSeparator)
		println "=== API-DUMP: ${jars.size()} jars"
		def find = file('api_find.txt')
		if (find.exists()) {
			find.readLines().findAll { it.trim() && !it.startsWith('#') }.each { pat ->
				println "=== FIND ${pat}"
				def rx = java.util.regex.Pattern.compile(pat)
				jars.each { j ->
					try {
						new java.util.zip.ZipFile(j).withCloseable { z ->
							z.entries().each { e ->
								if (e.name.endsWith('.class') && rx.matcher(e.name).find()) println "  ${e.name.replace('/', '.').replaceAll('\\.class$','')}"
							}
						}
					} catch (Throwable t) {}
				}
			}
		}
		def q = file('api_query.txt')
		if (q.exists()) {
			def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
			q.readLines().findAll { it.trim() && !it.startsWith('#') }.each { c ->
				println "=== CLASS ${c}"
				def pr = new ProcessBuilder(javap, '-protected', '-cp', cp, c.trim()).redirectErrorStream(true).start()
				println pr.inputStream.text
				pr.waitFor()
			}
		}
		println "=== API-DUMP END"
	}
}
tasks.named('compileJava') { finalizedBy 'apiDump' }

// ---- Дымовой тест сервера (включается rz_smoke=true в gradle.properties) ----
if (project.findProperty('rz_smoke') == 'true') {
	loom { runs { server { vmArg '-Drz.smoke=true' } } }
	tasks.matching { it.name == 'runServer' }.configureEach {
		timeout = java.time.Duration.ofMinutes(6)
		doFirst {
			def d = file('run'); d.mkdirs()
			// Лицензия Minecraft EULA принята владельцем проекта для этого тестового запуска в CI.
			new File(d, 'eula.txt').text = 'eula=true\n'
		}
	}
	tasks.named('build') { finalizedBy 'runServer' }
}
